<div class="card-selector">
  <h3 class="title">Elige una carta 👇</h3>
  <div class="cards-wrapper">
    <div class="cards-container">
      <button *ngFor="let card of cards"
              class="card"
              [class.selected]="selectedCard === card"
              (click)="selectCard(card)">
        {{ card }}
      </button>
    </div>
  </div>
</div>
