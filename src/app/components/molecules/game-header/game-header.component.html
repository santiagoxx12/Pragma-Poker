<header class="header">
  <div class="logo">
    <img src="assets/images/ficha-de-poker 1.svg" alt="Planning Poker" />
  </div>
  <h1 class="title">{{ title }}</h1>
  <div class="actions">
    <button class="refresh-btn">
      <i class="fas fa-sync-alt"></i>
    </button>
    <app-player-avatar [name]="playerName"></app-player-avatar>
    <button class="invite-btn" (click)="invitePlayers()">Invitar jugadores</button>
  </div>
</header>
