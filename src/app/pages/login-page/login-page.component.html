<div class="login-page">
  <div class="login-card">
    <div class="logo-container">
      <img src="assets/images/ficha-de-poker 1.svg" alt="Logo 2" class="logo" />
      <h1 class="title">Iniciar Sesión</h1>

    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <app-input-field
          label="Nombre"
          [control]="nameControl">
        </app-input-field>
      </div>

      <div class="role-selection">
        <h3>Selecciona tu rol:</h3>
        <div class="radio-group">
          <app-radio-button
            label="Administrador"
            value="admin"
            id="admin"
            [control]="roleControl">
          </app-radio-button>

          <app-radio-button
            label="Jugador"
            value="player"
            id="player"
            [control]="roleControl">
          </app-radio-button>
        </div>
      </div>

      <app-button
        text="Ingresar"
        [disabled]="loginForm.invalid">
      </app-button>
    </form>
  </div>
</div>
