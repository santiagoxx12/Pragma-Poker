<div class="header-container">
  <img src="assets/images/ficha-de-poker 1.svg" alt="Logo" class="logo" />
  <h2>Crear Partida</h2>
</div>
           
<div class="container">
  <form [formGroup]="gameForm" (ngSubmit)="onGameCreate()">
    <app-input-field
      label="Nombre de la partida"
      [control]="nameControl">
    </app-input-field>
    <app-button
      text="Crear Partida"
      [disabled]="gameForm.invalid">
    </app-button>
  </form>
</div>
